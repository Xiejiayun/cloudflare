      :root {

        background: #f7f3ec;

        line-height: 1.05;
        letter-spacing: 0;
      }

      p {
        max-width: 48ch;
        margin: 0 0 28px;
        color: #4c5963;
        font-size: 1.125rem;
        line-height: 1.7;
      }

      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        padding: 0 16px;
        border: 1px solid #c68d18;
        border-radius: 8px;
        background: #ffd567;
        color: #172027;
        font-weight: 700;
        text-decoration: none;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #11161c;
          color: #f4f0e8;
        }

        p {
          color: #bbc6d0;
        }

        a {
          border-color: #f2c158;
