<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Apps Pages</title>
    <meta
      name="description"
      content="A minimal static site ready for Cloudflare Pages deployment."
    />
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f7f3ec;
        color: #182026;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px;
      }

      main {
        width: min(100%, 720px);
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(2.25rem, 6vw, 4.5rem);
        line-height: 1;
        letter-spacing: 0;
      }

      p {
        max-width: 56ch;
        margin: 0;
        font-size: 1.125rem;
        line-height: 1.7;
        color: #4c5963;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #11161c;
          color: #f4f0e8;
        }

        p {
          color: #bbc6d0;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Apps Pages</h1>
      <p>
        This static site lives in the apps folder and is ready to deploy with
        Cloudflare Pages.
      </p>
    </main>
  </body>
</html>
